<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EDE2">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Семейное древо">
  <meta property="og:description" content="Загляните, найдите себя и допишите свою ветвь.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%232E4A3B' stroke-width='1.6'%3E%3Ccircle cx='16' cy='16' r='14'/%3E%3Ccircle cx='16.5' cy='15.5' r='9.5'/%3E%3Ccircle cx='15.5' cy='16.5' r='5'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%23B4603A' stroke='none'/%3E%3C/svg%3E">
  <title>Семейное древо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/cover.css">
  <link rel="stylesheet" href="styles/tree.css">
  <link rel="stylesheet" href="styles/panel.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/poster.css">
</head>
<body>

  <!-- Обложка: первый экран и «вход по имени» -->
  <section class="cover" id="cover" aria-labelledby="cover-title">
    <svg class="cover__rings" id="rings" viewBox="-520 -520 1040 1040" aria-hidden="true"></svg>
    <div class="cover__inner">
      <p class="eyebrow" id="cover-eyebrow">Семейный архив</p>
      <h1 class="cover__title" id="cover-title">Семейное <em>древо</em></h1>
      <p class="cover__lead">Одно место, где вся семья, в каком бы городе кто ни жил, собирает свою историю: имена, лица и рассказы о тех, кто был до нас.</p>

      <div class="dedication" id="dedication" hidden>
        <span class="dedication__age" id="dedication-age"></span>
        <p class="dedication__text" id="dedication-text"></p>
      </div>

      <form class="enter" id="enter-form" autocomplete="off" novalidate>
        <div class="enter__code" id="enter-code-row" hidden>
          <label class="enter__label" for="enter-code">Кодовое слово семьи</label>
          <input class="input input--lg" id="enter-code" name="code" type="text" placeholder="например, dub-klen-lipa-42" maxlength="80" autocapitalize="none" spellcheck="false">
        </div>
        <label class="enter__label" for="enter-name">Как вас зовут?</label>
        <div class="enter__row">
          <input class="input input--lg" id="enter-name" name="name" type="text" placeholder="Ваше имя" maxlength="40">
          <button class="btn btn--primary btn--lg" type="submit">Войти в древо <span aria-hidden="true">→</span></button>
        </div>
        <p class="enter__error" id="enter-error" role="alert"></p>
        <p class="enter__hint"><span id="enter-hint"></span> <button class="link-btn" id="logout-btn" type="button" hidden>Выйти на этом устройстве</button></p>
      </form>

      <dl class="stats" id="cover-stats"></dl>
    </div>
    <p class="cover__caption" id="rings-caption"></p>
  </section>

  <div class="app" id="app" inert>
    <header class="topbar">
      <button class="brand" id="brand" type="button" title="На обложку">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14"/><circle cx="16.5" cy="15.5" r="9.5"/><circle cx="15.5" cy="16.5" r="5"/><circle cx="16" cy="16" r="1.2" class="brand__dot"/>
        </svg>
        <span class="brand__text">Древо <small id="brand-surname"></small></span>
      </button>

      <nav class="tabs" aria-label="Разделы">
        <button class="tab" type="button" data-view="home">Сегодня</button>
        <button class="tab" type="button" data-view="tree">Древо</button>
        <button class="tab" type="button" data-view="stories">Истории</button>
      </nav>

      <button class="chip chip--branch" id="branch-chip" type="button" hidden></button>

      <div class="search">
        <input class="input search__input" id="search" type="search" placeholder="Найти человека" aria-label="Найти человека">
        <ul class="search__results" id="search-results" hidden></ul>
      </div>

      <button class="icon-btn" id="theme-btn" type="button" title="Оформление: бумага или изумруд" aria-label="Сменить оформление"></button>
      <button class="chip chip--me" id="me-chip" type="button" title="Сменить имя"></button>
    </header>

    <main class="workspace">
      <section class="view view--home" id="view-home" aria-label="Сегодня" hidden></section>
      <section class="view view--tree" id="view-tree" aria-label="Древо"></section>
      <section class="view view--stories" id="view-stories" aria-label="Истории" hidden></section>
      <aside class="panel" id="panel" aria-label="Карточка человека"></aside>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
